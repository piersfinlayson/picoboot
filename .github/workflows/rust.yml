name: Rust

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - 'NOTICE*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install rustfmt
      run: rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:

    # Every host, because the USB backend differs per platform and this crate
    # has a cfg branch for each.  A Linux-only run once passed a Windows build
    # that did not compile at all.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install clippy
      run: rustup component add clippy
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Build crate
      run: cargo build --all-features --verbose
    - name: Build examples
      run: cargo build --examples --all-features --verbose
    - name: Run tests
      run: cargo test --all-features --verbose
    - name: Build docs
      run: cargo doc --all-features --no-deps --verbose
      env:
        RUSTDOCFLAGS: -D warnings
